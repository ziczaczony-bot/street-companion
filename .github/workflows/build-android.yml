name: Build Android app

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true

      - name: Get packages
        run: flutter pub get

      - name: Check code
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build APK
        run: flutter build apk --release

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk street-companion.apk

      - name: Upload APK (build artifact)
        uses: actions/upload-artifact@v4
        with:
          name: street-companion-apk
          path: street-companion.apk

      # On main: publish the APK as a GitHub Release so it can be
      # downloaded straight to a phone from the repository's Releases page.
      - name: Publish release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Street Companion (build ${{ github.run_number }})
          make_latest: true
          body: |
            Android app, built automatically from commit ${{ github.sha }}.
            On your phone: download **street-companion.apk** below and open it.
          files: street-companion.apk
